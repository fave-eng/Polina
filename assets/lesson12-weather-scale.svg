<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
<title id="title">Temperature scale</title>
<desc id="desc">A clean temperature scale from 0 degrees Celsius to 100 degrees Celsius with six numbered positions. Freezing is shown as the example at position one.</desc>
<rect width="900" height="300" rx="28" fill="#ffffff"/>
<text x="70" y="245" font-family="Arial, sans-serif" font-size="28" fill="#334155">0°C</text>
<text x="770" y="245" font-family="Arial, sans-serif" font-size="28" fill="#334155">100°C</text>
<line x1="95" y1="180" x2="805" y2="180" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
<line x1="95" y1="168" x2="95" y2="205" stroke="#0f172a" stroke-width="5"/><text x="95" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1e293b">freezing</text><circle cx="95" cy="132" r="20" fill="#eef2ff" stroke="#6366f1" stroke-width="3"/><text x="95" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#4338ca">1</text><line x1="237" y1="168" x2="237" y2="205" stroke="#0f172a" stroke-width="5"/><circle cx="237" cy="118" r="22" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/><text x="237" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#475569">2</text><line x1="379" y1="168" x2="379" y2="205" stroke="#0f172a" stroke-width="5"/><circle cx="379" cy="118" r="22" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/><text x="379" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#475569">3</text><line x1="521" y1="168" x2="521" y2="205" stroke="#0f172a" stroke-width="5"/><circle cx="521" cy="118" r="22" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/><text x="521" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#475569">4</text><line x1="663" y1="168" x2="663" y2="205" stroke="#0f172a" stroke-width="5"/><circle cx="663" cy="118" r="22" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/><text x="663" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#475569">5</text><line x1="805" y1="168" x2="805" y2="205" stroke="#0f172a" stroke-width="5"/><circle cx="805" cy="118" r="22" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/><text x="805" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#475569">6</text></svg>
